[theme]
primaryColor = "#6366f1"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#0d1321"
textColor = "#e8eaf6"
font = "sans serif"

[client]
showErrorDetails = true
showSidebarNavigation = true

[logger]
level = "info"

[server]
address = "0.0.0.0"
headless = true
enableXsrfProtection = false
enableCORS = true
maxUploadSize = 200
port = 8501
enableWebsocketCompression = true
allowRunOnSave = false

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
